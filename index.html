/* ============ CARDS ============ */
const ExpCard=({e,i,onEdit})=><article className="glass card" style={{animationDelay:(i%12)*45+"ms"}}>
 <span className="eyebrow">EXPERIMENT {e.number}</span><h3>{e.title}</h3><p className="mut" style={{margin:0}}>{e.description}</p>
 <div>{e.module&&<span className="tag">{e.module}</span>}{e.difficulty!=="NA"&&<span className="tag">{e.difficulty}</span>}</div>
 <div>{e.tools.map(t=><span className="tag" key={t}>{t}</span>)}</div>
 <div className="row" style={{marginTop:"auto"}}><Link className="btn" to={`/experiments/${e.id}/overview`}>Overview →</Link>{onEdit&&<button className="btn g" onClick={()=>onEdit(e)}>Edit Experiment</button>}</div></article>;

/* ============ PAGES ============ */
function Home({exps}){
 const [loading,setLoading]=useState(true);useEffect(()=>{const t=setTimeout(()=>setLoading(false),350);return()=>clearTimeout(t)},[]);
 const stats=[[exps.length,"TOTAL EXPERIMENTS"],[MODS.length,"DATA SCIENCE MODULES"],[exps.reduce((a,e)=>a+e.subExperiments.length,0),"SUB EXPERIMENTS"],[TOOLS.length+"+","TOOLS"]];
 return <div>
  <section className="glass" style={{padding:"34px 26px",marginBottom:18}}>
   <h1><span className="grad">DATA SCIENCE LEARNING PORTAL</span></h1>
   <div style={{fontSize:18,letterSpacing:".12em",margin:"6px 0 12px"}}>Learn • Experiment • Analyze • Build</div>
   <p className="mut" style={{maxWidth:640}}>An interactive learning environment for Data Science students to explore modules, experiments, tools, documentation and practical code.</p>

  <div className="lay">
   <aside><div className="glass card" style={{position:"sticky",top:90,gap:10}}>
    <span className="eyebrow">STUDENT PROFILE</span>

    {[["Student Name",student.name],["Roll Number",student.rollNumber],["Branch",student.branch],["Section",student.section]].map(r=><div key={r[0]}><div className="mut" style={{fontSize:12}}>{r[0]}</div><b>{r[1]}</b></div>)}
    <hr style={{border:0,borderTop:"1px solid var(--bd)",width:"100%"}}/>
    <span className="eyebrow">FACULTY</span><div><b>{student.faculty.name}</b><div className="mut" style={{fontSize:12}}>Designation</div>{student.faculty.designation}</div>
    <div className="row"><SocialLink href={student.github}>GitHub</SocialLink><SocialLink href={student.linkedin}>LinkedIn</SocialLink></div></div></aside>
   <section style={{minWidth:0}}>
    <SearchBar exps={exps}/>
    <div className="stats">{stats.map((s,i)=><div key={i} className="glass stat card" style={{animationDelay:i*80+"ms"}}><b className="grad">{s[0]}</b><span className="mut" style={{fontSize:11,letterSpacing:".1em"}}>{s[1]}</span></div>)}</div>
    <h2>Learning Progress</h2>
    <div className="glass" style={{padding:16,display:"grid",gap:10}}>{MODS.map(m=><div key={m.id}><div className="row" style={{justifyContent:"space-between",fontSize:13}}><span>{m.title}</span><span className="mut">{m.progress}%</span></div><div className="bar"><i style={{width:m.progress+"%"}}/></div></div>)}</div>
    <h2>Experiments</h2>
    {loading?<div className="grid">{[1,2,3].map(i=><div key={i} className="sk"/>)}</div>:<div className="grid">{exps.slice(0,6).map((e,i)=><ExpCard key={e.id} e={e} i={i}/>)}</div>}
    <div style={{marginTop:16}}><Link className="btn g" to="/experiments">View all {exps.length} experiments →</Link></div>
   </section></div></div>};

function ExperimentsPage({exps,api}){
 const [q,setQ]=useState("");const [mod,setMod]=useState("All");const [diff,setDiff]=useState("All");const [tech,setTech]=useState("All");const [sort,setSort]=useState("num");const [edit,setEdit]=useState(null);
 const techs=["All",...new Set(EXPERIMENTS.flatMap(e=>e.tools))];
 const list=useMemo(()=>exps.filter(e=>(mod==="All"||e.moduleId===mod)&&(diff==="All"||e.difficulty===diff)&&(tech==="All"||e.tools.includes(tech))&&(e.title+e.description+e.tools.join(" ")).toLowerCase().includes(q.toLowerCase()))
  .sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="diff"?["Beginner","Intermediate","Advanced"].indexOf(a.difficulty)-["Beginner","Intermediate","Advanced"].indexOf(b.difficulty):a.id-b.id),[exps,q,mod,diff,tech,sort]);
 return <div><Crumbs items={[["Home","/"],["Experiments"]]}/><h1>Experiments</h1>
  <div className="row" style={{margin:"14px 0"}}>
   <input className="sel" style={{flex:"1 1 220px",padding:12,borderRadius:12,border:"1px solid var(--bd)",background:"var(--card)",color:"var(--fg)"}} aria-label="Filter experiments" placeholder="Search experiments…" value={q} onChange={e=>setQ(e.target.value)}/>
   <select className="sel" style={{width:"auto"}} aria-label="Module" value={mod} onChange={e=>setMod(e.target.value)}><option value="All">All modules</option>{MODS.map(m=><option key={m.id} value={m.id}>{m.title}</option>)}</select>
   <select className="sel" style={{width:"auto"}} aria-label="Difficulty" value={diff} onChange={e=>setDiff(e.target.value)}>{["All","Beginner","Intermediate","Advanced"].map(d=><option key={d}>{d}</option>)}</select>
   <select className="sel" style={{width:"auto"}} aria-label="Technology" value={tech} onChange={e=>setTech(e.target.value)}>{techs.map(d=><option key={d}>{d}</option>)}</select>
   <select className="sel" style={{width:"auto"}} aria-label="Sort" value={sort} onChange={e=>setSort(e.target.value)}><option value="num">Sort: Number</option><option value="title">Sort: Title</option><option value="diff">Sort: Difficulty</option></select></div>
  {list.length?<div className="grid">{list.map((e,i)=><ExpCard key={e.id} e={e} i={i} onEdit={setEdit}/>)}</div>:<Empty msg="No experiments found."/>}
  {edit&&<EditModal e={edit} api={api} onClose={()=>setEdit(null)}/>}</div>};

function EditModal({e,api,onClose}){
 const s=e.subExperiments[0];
 const [f,setF]=useState({number:e.number,title:e.title,description:e.description,module:e.module,difficulty:e.difficulty,tools:e.tools.join(", "),aim:s?s.aim:"",code:s?s.code:"",output:s?s.output:"",sub:e.subExperiments.map(x=>x.label+"  "+x.title).join("\n")||"NA"});
 const set=k=>ev=>setF({...f,[k]:ev.target.value});
 const save=()=>{api.save(e.id,{top:{number:f.number,title:f.title,description:f.description,module:f.module,difficulty:f.difficulty,tools:f.tools.split(",").map(x=>x.trim()).filter(Boolean)},...(s?{aim:f.aim,code:f.code,output:f.output}:{})});onClose()};
 useEffect(()=>{const k=ev=>ev.key==="Escape"&&onClose();addEventListener("keydown",k);return()=>removeEventListener("keydown",k)},[]);
 const F=(k,l,t)=><div className="fld"><label htmlFor={"f"+k}>{l}</label>{t?<textarea id={"f"+k} value={f[k]} onChange={set(k)}/>:<input id={"f"+k} value={f[k]} onChange={set(k)}/>}</div>;
 return <div className="modal" role="dialog" aria-modal="true" aria-label="Edit experiment" onClick={ev=>ev.target===ev.currentTarget&&onClose()}><div className="glass">
  <div className="eyebrow">EDIT EXPERIMENT</div><h2 style={{marginTop:6}}>{e.title}</h2>
  {F("number","Experiment Number")}{F("title","Title")}{F("description","Description",true)}
  <div className="fld"><label htmlFor="fmod">Module</label><select id="fmod" value={f.module} onChange={set("module")}><option value="">Not assigned</option>{MODS.map(m=><option key={m.id}>{m.title}</option>)}</select></div>
  <div className="fld"><label htmlFor="fd">Difficulty</label><select id="fd" value={f.difficulty} onChange={set("difficulty")}>{["NA","Beginner","Intermediate","Advanced"].map(d=><option key={d}>{d}</option>)}</select></div>
  {s&&<>{F("aim","Aim (first sub-experiment)",true)}{F("code","Code (first sub-experiment)",true)}{F("output","Expected output (first sub-experiment)",true)}</>}
  {F("tools","Tools (comma separated)")}
  <div className="fld"><label htmlFor="fsub">Sub Experiments (from the document; read-only)</label><textarea id="fsub" readOnly value={f.sub} style={{minHeight:60}}/></div>
  <div className="row" style={{justifyContent:"flex-end"}}>{api.edited[e.id]&&<button className="btn g" onClick={()=>{api.reset(e.id);onClose()}}>Revert to default</button>}<button className="btn g" onClick={onClose}>Cancel</button><button className="btn" onClick={save}>Save Changes</button></div></div></div>};

function Overview({e}){
 return <div><Crumbs items={[["Home","/"],["Experiments","/experiments"],["Experiment "+e.number]]}/>
  <span className="eyebrow">EXPERIMENT {e.number}</span><h1>{e.title}</h1>
  {!e.available?<div className="glass" style={{padding:34,textAlign:"center",marginTop:14}}><h2 style={{margin:0}}>Will be uploaded soon</h2><p className="mut">The programs for this experiment are not available yet (NA).</p><Link className="btn g" to="/experiments">Back to experiments</Link></div>:<>
  <h2>Summary</h2><div className="glass" style={{padding:"16px 18px 16px 36px"}}><p className="mut" style={{margin:"0 0 8px -18px"}}><b style={{color:"var(--fg)"}}>{e.overview.summary}</b></p><ul className="mut" style={{margin:0,lineHeight:1.8}}>{e.overview.items.map((t,i)=><li key={i}>{t}</li>)}</ul></div>
  <div className="stats">{[["Experiment",e.number],["Module",e.module||"NA"],["Difficulty",e.difficulty],["Sub Experiments",e.subExperiments.length],["Tools",e.tools.length]].map((s,i)=><div key={i} className="glass stat" style={{padding:14}}><b style={{fontSize:s[1].toString().length>8?15:28}}>{s[1]}</b><span className="mut" style={{fontSize:11}}>{s[0].toUpperCase()}</span></div>)}</div>
  <h2>Architecture</h2><div className="glass arch" role="img" aria-label={"Flow: "+e.overview.architecture.join(", ")}>{e.overview.architecture.map((n,i,a)=><React.Fragment key={i}><div className="node" style={{animationDelay:i*90+"ms"}}>{n.toUpperCase()}</div>{i<a.length-1&&<div className="line"/>}</React.Fragment>)}</div>
  <h2>Sub Experiments</h2><div className="grid">{e.subExperiments.map((s,i)=><Link key={s.id} to={`/experiments/${e.id}/${s.id}`}><div className="glass card sub" style={{animationDelay:i*60+"ms"}}><div className="L" style={{width:"auto",minWidth:46,padding:"0 8px",fontSize:13}}>{s.label}</div><div><h3 style={{fontSize:15}}>{s.title}</h3><span className="mut">Details, program, editor &amp; output</span></div></div></Link>)}</div></>}</div>};

function SubExperiment({e,sid}){
 const s=e.subExperiments.find(x=>x.id===sid);if(!s)return<NotFound/>;
 const i=e.subExperiments.indexOf(s);const prev=e.subExperiments[i-1],next=e.subExperiments[i+1];
 return <div><Crumbs items={[["Home","/"],["Experiments","/experiments"],["Experiment "+e.number,`/experiments/${e.id}/overview`],[s.label]]}/>
  <span className="eyebrow">EXPERIMENT {s.label}</span><h1 style={{fontSize:"clamp(22px,3.4vw,34px)"}}>{s.title}</h1>
  <h2>Experiment Details</h2>
  <div className="glass" style={{padding:18,display:"grid",gap:14}}>
   <div><div className="eyebrow">AIM</div><p className="mut" style={{margin:"6px 0 0"}}>{s.aim}</p></div>
   {s.syntax&&<div><div className="eyebrow" style={{marginBottom:6}}>SYNTAX</div><pre>{s.syntax}</pre></div>}
   {s.notes&&<div><div className="eyebrow">EXPLANATION / RESULT</div><div className="mut" style={{whiteSpace:"pre-wrap",marginTop:6}}>{s.notes}</div></div>}</div>
  {s.pending?<div className="glass" style={{padding:30,textAlign:"center",marginTop:18}}><h2 style={{margin:0}}>Will be uploaded soon</h2><p className="mut">The program for {s.label} is not available yet (NA).</p></div>:<>
  <h2>Program</h2><CodeBlock code={s.code} title={"PROGRAM "+s.label}/>
  <h2>Code Editor · Run · Output</h2><CodeRunner initial={s.code} setup={s.setup||""}/>
  <h2>Expected Output</h2><div className="glass" style={{padding:14}}><pre>{s.output||"NA"}</pre></div></>}
  {(s.labs||[]).map((l,k)=><React.Fragment key={k}><h2>{l.name}</h2><CodeBlock code={l.code} title="LAB PROGRAM"/><div style={{height:14}}/><CodeRunner initial={l.code} setup={l.setup||""}/></React.Fragment>)}
  {s.mine&&<><h2>{s.mine.name}</h2><CodeBlock code={s.mine.code} title="MY PROGRAM"/><div style={{height:14}}/><CodeRunner initial={s.mine.code} setup={s.mine.setup}/></>}
  <div className="row" style={{justifyContent:"space-between",marginTop:20}}>{prev?<Link className="btn g" to={`/experiments/${e.id}/${prev.id}`}>← {prev.label}</Link>:<span/>}{next&&<Link className="btn g" to={`/experiments/${e.id}/${next.id}`}>{next.label} →</Link>}</div></div>};

function ModulesPage(){return <div><Crumbs items={[["Home","/"],["Modules"]]}/><h1>Modules</h1><div className="grid" style={{marginTop:14}}>{MODS.map((m,i)=>{const n=EXPERIMENTS.filter(e=>e.moduleId===m.id).length,mt=MATERIALS.filter(x=>x.moduleId===m.id).length;
 return <article key={m.id} className="glass card" style={{animationDelay:i*70+"ms"}}><span className="eyebrow">MODULE {m.number}</span><h3>{m.title}</h3><p className="mut" style={{margin:0}}>{m.description}</p>
 <div>{m.topics.map(t=><span className="tag" key={t}>{t}</span>)}</div><div className="mut" style={{fontSize:12}}>{mt} materials · {n} experiments</div>
 <div className="bar"><i style={{width:m.progress+"%"}}/></div><span className="mut" style={{fontSize:12}}>Progress {m.progress}%</span><Link className="btn" to={"/modules/"+m.id} style={{marginTop:"auto",textAlign:"center"}}>Open Module</Link></article>})}</div></div>}

function ModuleDetails({id,exps}){
 const m=MODS.find(x=>x.id===id);if(!m)return<NotFound/>;
 const ex=exps.filter(e=>e.moduleId===id),mats=MATERIALS.filter(x=>x.moduleId===id),tl=[...new Set(ex.flatMap(e=>e.tools))].map(toolById).filter(Boolean);
 return <div><Crumbs items={[["Home","/"],["Modules","/modules"],["Module "+m.number]]}/><span className="eyebrow">MODULE {m.number}</span><h1>{m.title}</h1>
  <h2>Overview</h2><div className="glass" style={{padding:18}}><p className="mut" style={{margin:0}}>{m.description}</p></div>
  <h2>Learning Objectives</h2><div className="glass" style={{padding:"14px 18px 14px 36px"}}><ul className="mut" style={{margin:0,lineHeight:1.9}}>{m.topics.map(t=><li key={t}>Understand and apply {t.toLowerCase()} in real datasets</li>)}</ul></div>
  <h2>Topics</h2><div>{m.topics.map(t=><span className="tag" key={t} style={{fontSize:13,padding:"6px 12px"}}>{t}</span>)}</div>
  <h2>Experiments</h2><div className="grid">{ex.map((e,i)=><ExpCard key={e.id} e={e} i={i}/>)}</div>
  <h2>Study Materials</h2><div className="grid">{mats.map(x=><Link key={x.id} to={"/materials/"+x.id}><div className="glass card sub"><div className="L">PDF</div><div><b>{x.title}</b><div className="mut" style={{fontSize:12}}>{x.pages} pages</div></div></div></Link>)}</div>
  <h2>Tools</h2><div className="grid">{tl.map(t=><ToolCard key={t.id} t={t}/>)}</div></div>};

function PdfViewer({id}){
 const m=MATERIALS.find(x=>x.id===id);const [p,setP]=useState(1);const [z,setZ]=useState(1);const box=useRef();
 if(!m)return<div><Empty msg="Unable to load material." sub="Try again."/><Link className="btn" to="/modules">Back to modules</Link></div>;
 const mod=MODS.find(x=>x.id===m.moduleId);
 return <div><Crumbs items={[["Home","/"],["Modules","/modules"],["Module "+mod.number,"/modules/"+mod.id],[m.title]]}/><h1 style={{fontSize:28}}>{m.title}</h1>
  <div className="row" style={{margin:"12px 0"}}><button className="btn g" disabled={p<=1} onClick={()=>setP(p-1)}>◀ Prev</button><span>Page {p} / {m.pages}</span><button className="btn g" disabled={p>=m.pages} onClick={()=>setP(p+1)}>Next ▶</button>
   <button className="btn g" onClick={()=>setZ(Math.max(.6,z-.2))}>－</button><span>{Math.round(z*100)}%</span><button className="btn g" onClick={()=>setZ(Math.min(2,z+.2))}>＋</button>
   <button className="btn g" onClick={()=>box.current&&box.current.requestFullscreen&&box.current.requestFullscreen()}>Full screen</button>
   {m.file?<><a className="btn g" href={m.file} download>Download</a><a className="btn g" href={m.file} target="_blank" rel="noopener noreferrer">Open in new tab</a></>:<span className="mut">Download / new tab enabled once a real file URL is set in materials.js</span>}</div>
  <div ref={box} className="glass" style={{padding:20,overflow:"auto",background:"var(--bg)"}}>
   {m.file?<iframe title={m.title} src={m.file+"#page="+p} style={{width:"100%",height:"70vh",border:0}}/>:
   <div style={{width:560*z,maxWidth:"none",minHeight:720*z,margin:"0 auto",background:"#fff",color:"#222",padding:40*z,fontSize:14*z,borderRadius:6,boxShadow:"0 4px 24px rgba(0,0,0,.3)"}}>
    <b style={{fontSize:20*z}}>{m.title.replace(".pdf","")}</b><div style={{color:"#777",margin:`${6*z}px 0 ${20*z}px`}}>Sample preview · page {p}</div>
    {[1,2,3,4,5,6,7].map(k=><div key={k} style={{height:10*z,background:"#e6e9f2",borderRadius:4,margin:`${12*z}px 0`,width:(60+(k*13+p*7)%40)+"%"}}/>)}</div>}</div></div>};

const ToolCard=({t})=><article className="glass card"><div className="logo" style={{width:44,height:44}} aria-hidden="true">{t.name.slice(0,2)}</div><h3>{t.name}</h3><span className="eyebrow">{t.category.toUpperCase()}</span><p className="mut" style={{margin:0}}>{t.description}</p>
 <div className="row" style={{marginTop:"auto"}}><Link className="btn" to={"/tools/"+t.id}>Documentation →</Link><a className="btn g" href={t.site} target="_blank" rel="noopener noreferrer">Website ↗</a></div></article>;

function ToolsPage(){const cats=[...new Set(TOOLS.map(t=>t.category))];return <div><Crumbs items={[["Home","/"],["Tools"]]}/><h1>Tools</h1>{cats.map(c=><section key={c}><h2>{c}</h2><div className="grid">{TOOLS.filter(t=>t.category===c).map(t=><ToolCard key={t.id} t={t}/>)}</div></section>)}</div>}

function ToolDetails({id,exps}){
 const t=TOOLS.find(x=>x.id===id);if(!t)return<NotFound/>;const ex=exps.filter(e=>e.tools.includes(t.name));
 const usage=importName[t.name]?`import ${importName[t.name]}\n\n# Example with ${t.name}\nprint("${t.name} ready")`:`# ${t.name} quick start\n${t.install}`;
 return <div><Crumbs items={[["Home","/"],["Tools","/tools"],[t.name]]}/><h1>{t.name.toUpperCase()}</h1><span className="eyebrow">{t.category.toUpperCase()}</span>
  <h2>Overview</h2><div className="glass" style={{padding:18}}><p className="mut" style={{margin:0}}>{t.description}</p></div>
  <h2>Features</h2><div className="glass" style={{padding:"14px 18px 14px 36px"}}><ul className="mut" style={{margin:0,lineHeight:1.9}}><li>Widely used in the {t.category.toLowerCase()} workflow</li><li>Active open-source / vendor community and documentation</li><li>Integrates with the rest of the Python data science stack</li></ul></div>
  <h2>Installation</h2><CodeBlock title="TERMINAL" code={t.install}/>
  <h2>Basic Usage</h2><CodeBlock code={usage}/>
  <h2>Examples</h2><CodeBlock code={t.name==="Pandas"?'import pandas as pd\n\ndf = pd.read_csv("data.csv")\nprint(df.head())':usage}/>
  <h2>Experiments Using This Tool</h2>{ex.length?<div className="grid">{ex.map((e,i)=><ExpCard key={e.id} e={e} i={i}/>)}</div>:<Empty msg="No experiments use this tool yet." sub=""/>}
  <h2>Documentation &amp; Official Website</h2><div className="row"><a className="btn" href={t.docs} target="_blank" rel="noopener noreferrer">Documentation ↗</a><a className="btn g" href={t.site} target="_blank" rel="noopener noreferrer">Official Website ↗</a></div></div>};

const NotFound=()=><div className="glass" style={{padding:50,textAlign:"center"}}><h1 className="grad" style={{fontSize:80}}>404</h1><h2>Page Not Found</h2><Link className="btn" to="/">Return Home</Link></div>;

/* ============ APP / ROUTER ============ */
function App(){
 const route=useHash();const api=useExperiments();const {exps}=api;
 const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("mbu-theme")||"dark"}catch(e){return"dark"}});
 useEffect(()=>{document.documentElement.dataset.theme=theme;try{localStorage.setItem("mbu-theme",theme)}catch(e){}},[theme]);
 const p=route.split("/").filter(Boolean);const E=id=>exps.find(e=>e.id===id);
 let page;
 if(!p.length)page=<Home exps={exps}/>;
 else if(p[0]==="modules")page=p[1]?<ModuleDetails id={p[1]} exps={exps}/>:<ModulesPage/>;
 else if(p[0]==="experiments"){
  if(!p[1])page=<ExperimentsPage exps={exps} api={api}/>;
  else{const e=E(p[1]);page=!e?<NotFound/>:!p[2]||p[2]==="overview"?<Overview e={e}/>:<SubExperiment e={e} sid={p[2].toLowerCase()}/>}}
 else if(p[0]==="tools")page=p[1]?<ToolDetails id={p[1]} exps={exps}/>:<ToolsPage/>;
 else if(p[0]==="materials"&&p[1])page=<PdfViewer id={p[1]}/>;
 else page=<NotFound/>;
 return <><Header route={route} theme={theme} setTheme={setTheme} exps={exps}/><div className="wrap"><main key={route}>{page}</main></div><Footer/></>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
